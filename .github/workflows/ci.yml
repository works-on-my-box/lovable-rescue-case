name: CI

on:
  push:
  pull_request:

jobs:
  after:
    name: after/ — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: after
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: after/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  before:
    name: before/ — build is expected to fail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: before/package-lock.json
      - run: npm ci
      - name: Confirm the handed-over app still does not build
        run: |
          if npm run build; then
            echo "::error::before/ unexpectedly builds — the case study is out of date"; exit 1
          else
            echo "before/ fails to build, as documented"
          fi

  rls-audit:
    name: rls-audit/ — policies, probes and fix run on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the demo end to end
        run: ./rls-audit/run.sh --with-index
      - name: Confirm the generated policies leak and the fixed ones do not
        run: |
          out=$(./rls-audit/run.sh)
          echo "$out" | grep -q 'new row violates row-level security policy for table "project_members"'
          echo "$out" | grep -q 'permission denied for table profiles'
          echo "$out" | grep -c 'reads every row' | grep -qx 5
