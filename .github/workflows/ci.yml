name: CI

on:
  push:
  pull_request:

jobs:
  after:
    name: after/ — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: after
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: after/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  before:
    name: before/ — build is expected to fail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: before/package-lock.json
      - run: npm ci
      - name: Confirm the handed-over app still does not build
        run: |
          if npm run build; then
            echo "::error::before/ unexpectedly builds — the case study is out of date"; exit 1
          else
            echo "before/ fails to build, as documented"
          fi

  rls-audit:
    name: rls-audit/ — policies, probes and fix run on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the demo end to end
        run: |
          set -o pipefail
          ./rls-audit/run.sh --with-index 2>&1 | tee run.out
      - name: Confirm the generated policies leak and the fixed ones do not
        run: |
          # before the fix: carol updates alice's task and plants herself as an owner and an admin
          grep -c '^UPDATE 1' run.out | grep -qx 3
          grep -q '^INSERT 0 1' run.out
          grep -c 'reads every row' run.out | grep -qx 5
          # the obvious members policy recurses, which is why the fix goes through a function
          grep -q 'infinite recursion detected in policy for relation "project_members"' run.out
          # after the fix: anon has no table privileges, the same update touches nothing,
          # the writes are refused, the audit is clean
          grep -q '^UPDATE 0' run.out
          grep -q 'new row violates row-level security policy for table "project_members"' run.out
          grep -c 'permission denied for table profiles' run.out | grep -qx 2
          grep -c 'reads every row' run.out | grep -qx 5
          # and the app still works: a signed-in user creates a project and sees it
          grep -qx ' Beta' run.out
